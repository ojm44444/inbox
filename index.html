<style>
:root {
  --bg:#0b0c0f; --side:#0e0f13; --panel:#131419; --raise:#1a1b21; --hover:#1c1d24; --sel:#22233a;
  --line:#202129; --line2:#2b2c35; --text:#ececf1; --dim:#a0a1ad; --faint:#6c6d79;
  --acc:#6d6af5; --acc2:#8b89ff; --accbg:rgba(109,106,245,.14);
  --fix:#ff6b6b; --reply:#4cc38a; --chase:#f5a524; --learn:#5aa7ff; --noise:#7a7b87;
  --shadow:0 12px 32px rgba(0,0,0,.45); --r:12px;
}
:root[data-theme="light"] {
  --bg:#f6f6f7; --side:#efeff2; --panel:#fff; --raise:#f6f6f8; --hover:#f0f0f4; --sel:#ebeafe;
  --line:#e8e8ec; --line2:#dcdce2; --text:#17171b; --dim:#5b5c66; --faint:#8b8c96; --accbg:rgba(109,106,245,.1); --shadow:0 12px 32px rgba(20,20,40,.12);
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg:#f6f6f7; --side:#efeff2; --panel:#fff; --raise:#f6f6f8; --hover:#f0f0f4; --sel:#ebeafe;
  --line:#e8e8ec; --line2:#dcdce2; --text:#17171b; --dim:#5b5c66; --faint:#8b8c96; --accbg:rgba(109,106,245,.1); --shadow:0 12px 32px rgba(20,20,40,.12);
} }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--text); font:13.5px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
button, select, input, textarea { font:inherit; color:inherit; }
a { color:var(--acc2); text-decoration:none; }
svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.app { display:grid; grid-template-columns:220px 1fr; height:100vh; height:100dvh; }
.app.mail { grid-template-columns:220px 420px 1fr; }
.side { background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:14px 10px; gap:2px; min-height:0; }
.brand { display:flex; align-items:center; gap:10px; padding:4px 8px 16px; font-weight:700; font-size:15px; }
.logo { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,var(--acc),#a26bf5); display:grid; place-items:center; }
.logo svg { width:15px; height:15px; stroke:#fff; stroke-width:2.2; }
.navlabel { font-size:11px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; padding:16px 10px 6px; }
.nav { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:8px; cursor:pointer; color:var(--dim); border:0; background:none; width:100%; text-align:left; }
.nav:hover { background:var(--hover); color:var(--text); }
.nav.on { background:var(--raise); color:var(--text); box-shadow:inset 0 0 0 1px var(--line2); }
.dot { width:8px; height:8px; border-radius:3px; flex:none; display:inline-block; }
.nav .n { margin-left:auto; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; }
.nav.on .n { color:var(--text); }
.sidefoot { margin-top:auto; padding:10px 8px; font-size:12px; color:var(--faint); display:flex; align-items:center; gap:4px; }
.iconbtn { border:0; background:none; padding:6px; border-radius:7px; cursor:pointer; color:var(--dim); display:inline-grid; place-items:center; }
.iconbtn:hover { background:var(--hover); color:var(--text); }
.spin svg { animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.home { overflow-y:auto; padding:28px 32px 60px; }
.hello { font-size:24px; font-weight:700; letter-spacing:-.02em; margin:0; }
.hellosub { color:var(--dim); margin:4px 0 22px; }
.tiles { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:22px; }
.tile { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; cursor:pointer; transition:border-color .15s, transform .15s; }
.tile:hover { border-color:var(--line2); transform:translateY(-1px); }
.tile .lab { display:flex; align-items:center; gap:7px; color:var(--dim); font-size:12.5px; }
.tile .num { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-top:6px; font-variant-numeric:tabular-nums; }
.tile .hint { color:var(--faint); font-size:12px; }
.grid2 { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:16px; }
.grid2 > div, .home, .chatrow > div { min-width:0; }
.box { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; margin-bottom:16px; }
.box h3 { margin:0 0 4px; font-size:14px; font-weight:650; display:flex; align-items:center; gap:8px; }
.box .bsub { color:var(--faint); font-size:12px; margin-bottom:10px; }
.chatrow { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
.chatrow:first-of-type { border-top:0; }
.chatico { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; font-weight:700; font-size:13px; color:#fff; flex:none; }
.chatrow .t { font-weight:600; }
.chatrow .s { color:var(--faint); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mini { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); cursor:pointer; }
.mini:first-of-type { border-top:0; }
.mini:hover .t { color:var(--acc2); }
.mini .t { font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mini .s { color:var(--faint); font-size:12px; margin-left:auto; white-space:nowrap; }
.tl { position:relative; padding-left:16px; }
.tl::before { content:""; position:absolute; left:4px; top:6px; bottom:6px; width:2px; background:var(--line2); border-radius:2px; }
.tli { position:relative; padding:5px 0 7px; }
.tli::before { content:""; position:absolute; left:-15px; top:11px; width:8px; height:8px; border-radius:50%; background:var(--acc); box-shadow:0 0 0 3px var(--panel); }
.tli.free::before { background:var(--reply); }
.tli.allday::before { background:var(--chase); }
.tli .tm { color:var(--faint); font-size:12px; font-variant-numeric:tabular-nums; }
.tli .tt { font-weight:550; }
.tli.free .tt { color:var(--reply); font-weight:500; }
.dayh { font-size:11px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; margin:10px 0 2px; }
.list { border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.listhead { padding:16px 16px 8px; display:flex; align-items:center; gap:10px; }
.listhead h1 { margin:0; font-size:17px; font-weight:650; letter-spacing:-.015em; }
.listhead .sub { color:var(--faint); font-size:12px; }
.filters { padding:0 14px 10px; display:flex; flex-direction:column; gap:8px; }
.search { display:flex; align-items:center; gap:8px; height:34px; border:1px solid var(--line2); border-radius:9px; background:var(--panel); padding:0 10px; color:var(--faint); }
.search input { flex:1; border:0; outline:0; background:none; color:var(--text); min-width:0; }
.chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.fchip { border:1px solid var(--line2); background:none; border-radius:20px; padding:3px 10px; font-size:12px; color:var(--dim); cursor:pointer; }
.fchip.on { background:var(--text); color:var(--bg); border-color:var(--text); }
.fsel { border:1px solid var(--line2); background:var(--panel); border-radius:20px; padding:3px 8px; font-size:12px; color:var(--dim); cursor:pointer; }
.rows { overflow-y:auto; flex:1; padding:0 8px 80px; }
.row { display:grid; grid-template-columns:18px 32px 1fr auto; gap:10px; align-items:start; padding:10px; border-radius:9px; cursor:pointer; }
.row:hover { background:var(--hover); }
.row.on { background:var(--sel); }
.row .ck { opacity:0; margin-top:2px; }
.row:hover .ck, .row .ck.show { opacity:1; }
.row.read .who, .row.read .l2 { font-weight:400; color:var(--dim); }
.ck { width:16px; height:16px; border-radius:5px; border:1.5px solid var(--line2); display:grid; place-items:center; cursor:pointer; }
.ck.show { background:var(--acc); border-color:var(--acc); }
.ck.show::after { content:""; width:8px; height:4px; border:2px solid #fff; border-top:0; border-right:0; transform:rotate(-45deg) translate(1px,-1px); }
.who { font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
.unreaddot { width:7px; height:7px; border-radius:50%; background:var(--acc); flex:none; }
.badge { background:var(--accbg); color:var(--acc2); font-size:11px; font-weight:600; padding:0 6px; border-radius:9px; line-height:17px; }
.l2 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
.l3 { color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px; }
.when { color:var(--faint); font-size:12px; white-space:nowrap; text-align:right; }
.when .pd { display:block; margin-top:4px; }
.wait { color:var(--chase); }
.empty { text-align:center; color:var(--faint); padding:60px 20px; }
.empty b { display:block; color:var(--dim); font-size:15px; margin-bottom:4px; }
.detail { display:flex; flex-direction:column; min-height:0; background:var(--panel); }
.dhead { padding:18px 26px 12px; }
.dhead h2 { margin:0 0 8px; font-size:20px; font-weight:650; letter-spacing:-.02em; line-height:1.3; }
.meta { display:flex; gap:6px; flex-wrap:wrap; align-items:center; color:var(--dim); font-size:12.5px; }
.chip { display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:20px; background:var(--raise); border:1px solid var(--line); font-size:12px; color:var(--dim); }
.bar { display:flex; gap:6px; flex-wrap:wrap; padding:10px 26px 14px; border-bottom:1px solid var(--line); align-items:center; }
.btn { display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px; border-radius:8px; border:1px solid var(--line2); background:var(--raise); cursor:pointer; font-weight:500; white-space:nowrap; }
.btn:hover { background:var(--hover); }
.btn.pri { background:var(--acc); border-color:var(--acc); color:#fff; }
.btn.pri:hover { background:var(--acc2); }
.btn.ghost { background:none; border-color:transparent; color:var(--dim); }
.btn.ghost:hover { background:var(--hover); color:var(--text); }
.btn.danger { color:var(--fix); }
.btn:disabled { opacity:.55; cursor:default; }
.btn.sm { height:28px; padding:0 10px; font-size:12.5px; }
kbd { font:11px Inter,sans-serif; color:var(--faint); border:1px solid var(--line2); border-bottom-width:2px; border-radius:4px; padding:0 4px; }
.btn.pri kbd { color:rgba(255,255,255,.85); border-color:rgba(255,255,255,.35); }
.sel { height:32px; border-radius:8px; border:1px solid var(--line2); background:var(--raise); padding:0 8px; cursor:pointer; }
.explain { margin:14px 26px 0; padding:10px 14px; border-radius:10px; background:var(--accbg); color:var(--text); font-size:13px; display:flex; gap:10px; align-items:flex-start; }
.explain svg { color:var(--acc2); margin-top:2px; }
.dbody { overflow-y:auto; flex:1; padding:16px 26px 40px; }
.issue { border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden; }
.issue .ih { display:flex; gap:10px; align-items:center; padding:10px 14px; cursor:pointer; }
.issue .ih:hover { background:var(--hover); }
.issue .ih .t { font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.issue .ih .s { color:var(--faint); font-size:12px; white-space:nowrap; }
.msg { border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; background:var(--bg); }
.msg .mh { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); }
.av { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:12px; color:#fff; flex:none; }
.msg .mh .f { font-weight:600; }
.msg .mh .d { color:var(--faint); font-size:12px; margin-left:auto; white-space:nowrap; }
.msg iframe { width:100%; border:0; display:block; background:#fff; min-height:120px; }
.msg pre { margin:0; padding:14px 16px; white-space:pre-wrap; font:13.5px/1.6 Inter,sans-serif; word-break:break-word; }
.composer { border:1px solid var(--line2); border-radius:12px; background:var(--bg); margin-bottom:14px; overflow:hidden; }
.composer .ch { display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--line); color:var(--dim); font-size:12px; }
.composer textarea { width:100%; min-height:170px; border:0; outline:0; background:none; padding:12px 14px; resize:vertical; font:13.5px/1.6 Inter,sans-serif; }
.composer .cf { display:flex; gap:6px; padding:8px 10px; border-top:1px solid var(--line); align-items:center; }
.saved { color:var(--reply); font-size:12px; display:inline-flex; gap:5px; align-items:center; }
.placeholder { display:grid; place-items:center; height:100%; color:var(--faint); text-align:center; }
.skel { height:54px; margin:6px 10px; border-radius:9px; background:linear-gradient(90deg,var(--panel),var(--raise),var(--panel)); background-size:200% 100%; animation:sh 1.2s infinite; }
@keyframes sh { to { background-position:-200% 0; } }
.bulk { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(120px); background:var(--raise); border:1px solid var(--line2); border-radius:12px; box-shadow:var(--shadow); padding:8px; display:flex; gap:6px; align-items:center; transition:transform .2s ease; z-index:20; }
.bulk.show { transform:translateX(-50%) translateY(0); }
.bulk b { padding:0 8px; }
.toast { position:fixed; right:20px; bottom:20px; background:var(--raise); border:1px solid var(--line2); border-radius:10px; padding:10px 14px; box-shadow:var(--shadow); z-index:30; opacity:0; transform:translateY(10px); transition:all .2s; pointer-events:none; max-width:380px; }
.toast.show { opacity:1; transform:none; }
.toast.err { border-color:var(--fix); }
.warn { margin:0 14px 8px; padding:8px 12px; border-radius:8px; background:rgba(245,165,36,.1); color:var(--chase); font-size:12px; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:grid; place-items:center; z-index:40; }
.mbox { width:min(640px,92vw); background:var(--panel); border:1px solid var(--line2); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow); }
.mbox textarea { height:300px; border:1px solid var(--line2); border-radius:8px; background:var(--bg); color:var(--text); padding:10px; font:12.5px/1.5 Inter,sans-serif; }
.chatpick { display:flex; flex-direction:column; gap:4px; max-height:360px; overflow:auto; }
.pickrow { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; border:1px solid transparent; background:none; cursor:pointer; color:var(--text); }
.pickrow:hover { background:var(--hover); border-color:var(--line2); }
.pickrow .t { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pickrow .s { color:var(--faint); font-size:12px; white-space:nowrap; }
.sug { display:inline-block; margin-top:2px; font-size:11px; color:var(--acc2); background:var(--accbg); padding:0 6px; border-radius:8px; }
.noteinp { height:34px; border:1px solid var(--line2); border-radius:9px; background:var(--bg); color:var(--text); padding:0 10px; }
.sentrow { display:flex; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); font-size:13px; }
.sentrow:first-of-type { border-top:0; }
.reader { max-width:900px; margin:0 auto; width:100%; }
.art { border:1px solid var(--line); border-radius:var(--r); background:var(--panel); margin-top:16px; overflow:hidden; }
.art.read { opacity:.6; }
.arth { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
.artn { width:24px; height:24px; border-radius:7px; background:var(--accbg); color:var(--acc2); display:grid; place-items:center; font-size:12px; font-weight:700; flex:none; }
.artt { font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.art .msg { border:0; border-radius:0; margin:0; }
.art .msg .mh { display:none; }
.acct { display:inline-block; font-size:10.5px; font-weight:600; letter-spacing:.02em; color:var(--c); background:color-mix(in srgb, var(--c) 14%, transparent); border-radius:5px; padding:0 5px; margin-right:6px; line-height:16px; vertical-align:1px; }
.strip { display:flex; gap:8px; flex-wrap:wrap; margin:-8px 0 20px; }
.ichip { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line2); background:var(--panel); border-radius:20px; padding:5px 12px; color:var(--dim); cursor:pointer; font-size:12.5px; }
.ichip b { color:var(--text); font-weight:650; }
.ichip.on { border-color:var(--text); color:var(--text); }
.about { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; background:var(--bg); display:flex; flex-direction:column; gap:8px; }
.ab1 { display:flex; gap:10px; align-items:center; }
.abf { color:var(--dim); font-size:12.5px; }
.abh { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; background:var(--accbg); padding:8px 10px; border-radius:9px; }
.abh svg { color:var(--acc2); }
.abr { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
.abr .l3 { margin-right:4px; }
/* design pass, 4 Nov */
body { background:radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb, var(--acc) 10%, transparent), transparent 60%), var(--bg); }
.side { background:color-mix(in srgb, var(--side) 88%, transparent); backdrop-filter:blur(14px); }
.nav { transition:background .15s, color .15s; }
.hero { margin-bottom:18px; }
.hero .day { color:var(--faint); font-size:12px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:4px; }
.hello { font-size:30px; letter-spacing:-.03em; background:linear-gradient(90deg, var(--text), color-mix(in srgb, var(--acc2) 70%, var(--text))); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hellosub { font-size:14px; margin-bottom:0; }
.tile { position:relative; overflow:hidden; background:linear-gradient(160deg, color-mix(in srgb, var(--c) 9%, var(--panel)), var(--panel) 60%); border-color:color-mix(in srgb, var(--c) 18%, var(--line)); box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px rgba(0,0,0,.12); }
.tile:hover { border-color:color-mix(in srgb, var(--c) 45%, var(--line)); transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.2); }
.tile::after { content:""; position:absolute; right:-30px; top:-30px; width:110px; height:110px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%); }
.pico { width:24px; height:24px; border-radius:7px; display:grid; place-items:center; background:color-mix(in srgb, var(--c) 18%, transparent); color:var(--c); }
.pico svg { width:14px; height:14px; stroke-width:2.1; }
.tile .num { font-size:32px; }
.box { box-shadow:0 6px 18px rgba(0,0,0,.08); }
.box h3 svg { color:var(--acc2); }
.rowav { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:11.5px; margin-top:1px; box-shadow:0 0 0 2px var(--bg); }
.row { transition:background .12s; }
.row.on { box-shadow:inset 3px 0 0 var(--acc); }
.row.read .rowav { opacity:.55; }
.btn { transition:background .12s, border-color .12s, transform .08s; }
.btn:active { transform:scale(.97); }
.btn.pri { box-shadow:0 4px 14px color-mix(in srgb, var(--acc) 35%, transparent); }
.dhead h2 { font-size:22px; }
.detail, .list { animation:fadein .18s ease; }
@keyframes fadein { from { opacity:.6; } to { opacity:1; } }
.msg { box-shadow:0 4px 14px rgba(0,0,0,.08); }
.ichip { transition:border-color .12s, background .12s; }
.ichip:hover { border-color:var(--c, var(--line2)); }
.modal { animation:fadein .15s ease; backdrop-filter:blur(4px); }
.mbox { animation:pop .18s ease; }
@keyframes pop { from { transform:translateY(8px) scale(.98); opacity:0; } to { transform:none; opacity:1; } }
.gate { display:grid; place-items:center; height:100vh; }
.gate .box2 { width:min(360px,90vw); text-align:center; }
.back, .tabs { display:none; }
@media (max-width:1300px) { .app.mail { grid-template-columns:190px 320px 1fr; } .dhead, .bar, .dbody { padding-left:18px; padding-right:18px; } .explain { margin-left:18px; margin-right:18px; } }
@media (max-width:1100px) { .tiles { grid-template-columns:repeat(3,minmax(0,1fr)); } .grid2 { grid-template-columns:minmax(0,1fr); } }
@media (max-width:900px) {
  body { overflow:auto; }
  .app, .app.mail { grid-template-columns:1fr; height:auto; min-height:100dvh; }
  .side { display:none; }
  .home { padding:calc(18px + env(safe-area-inset-top)) 16px 60px; overflow:visible; }
  html, body { overflow-x:hidden; }
  .tiles { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .tile .hint { display:none; }
  .chatrow .btn { padding:0 8px; }
  .list { border-right:0; min-height:100dvh; }
  .rows { overflow:visible; }
  .tabs { display:flex; gap:6px; overflow-x:auto; padding:calc(10px + env(safe-area-inset-top)) 14px 6px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; border:1px solid var(--line2); background:var(--panel); border-radius:20px; padding:6px 12px; font-size:13px; color:var(--dim); display:flex; gap:6px; align-items:center; cursor:pointer; }
  .tab.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  .detail { position:fixed; inset:0; z-index:10; transform:translateX(100%); transition:transform .22s ease; }
  .detail.open { transform:none; }
  .back { display:inline-grid; }
  .dhead, .bar, .dbody { padding-left:16px; padding-right:16px; }
  .dhead { padding-top:calc(14px + env(safe-area-inset-top)); }
  .explain { margin-left:16px; margin-right:16px; }
  kbd { display:none; }
  .row .ck { opacity:1; }
}

var S = { token:'', key:'', data:null, view:'home', open:null, sel:{}, drafts:{}, threads:{}, openIssue:{}, busy:'', loading:true, refreshing:false, phoneOpen:false,
  f:{ q:'', unread:true, chat:'', acct:'' } };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function ago(at) { var m = (Date.now() - Date.parse(at)) / 60000; if (m < 60) return Math.max(1, Math.floor(m)) + 'm'; if (m < 1440) return Math.floor(m / 60) + 'h'; return Math.floor(m / 1440) + 'd'; }
function hm(iso) { return new Date(iso).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone:'Europe/London' }); }
function dayName(iso) { return new Date(iso).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'short', timeZone:'Europe/London' }); }
function initials(s) { var w = String(s || '?').replace(/[<"].*$/, '').trim().split(/[\s@._-]+/).filter(Boolean); return ((w[0] || '?')[0] + ((w[1] || '')[0] || '')).toUpperCase(); }
function hue(s) { var h = 0; String(s || '').split('').forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) % 360; }); return 'hsl(' + h + ',55%,48%)'; }
function chatShort(c) { return c === 'FANFLOWY / FAN HUB' ? 'Fan hub' : c === 'Hormozi / King Kong Skills' ? 'Hormozi' : c === 'General TO DOs' ? 'General' : c; }
function toast(msg, bad) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = 'toast'; }, 2800); }

// Changes (read, unread, move, bin) go one at a time, in the order Owen made them,
// so a quick read-then-unread can never finish the wrong way round.
var WRITES = { markRead:1, markUnread:1, setPile:1, setChat:1, bin:1, saveDraft:1 }, queue = Promise.resolve();
function api(op, args) {
  if (WRITES[op]) { var p = queue.then(function () { return send(op, args); }); queue = p.catch(function () {}); return p; }
  return send(op, args);
}
function send(op, args) {
  return fetch(API, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, redirect:'follow', body:JSON.stringify({ action:'inboxApi', idToken:S.token, key:S.key, op:op, args:args || {} }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'Something went wrong'); return j.data; });
}

function isRead(e) { return e.status && e.status !== 'open'; }
function groups() {
  var by = {}, out = [];
  ((S.data && S.data.emails) || []).forEach(function (e) {
    var g = by[e.group];
    if (!g) { g = by[e.group] = { key:e.group, pile:e.category || 'new', items:[] }; out.push(g); }
    g.items.push(e);
  });
  out.forEach(function (g) {
    g.id = 'g' + Math.abs(g.key.split('').reduce(function (a, c) { return (a * 31 + c.charCodeAt(0)) | 0; }, 7));
    g.unread = g.items.filter(function (e) { return !isRead(e); });
    g.chat = g.items[0].project || 'General TO DOs';
    g.isChat = g.pile === 'fix';
  });
  return out;
}
function visible(g) { return S.f.unread ? g.unread.length > 0 : true; }
function matches(g) {
  if (S.f.chat && g.chat !== S.f.chat) return false;
  if (S.f.acct && !g.items.some(function (e) { return (e.account || 'personal') === S.f.acct; })) return false;
  if (!S.f.q) return true;
  var q = S.f.q.toLowerCase();
  return g.items.some(function (e) { return (e.from_name + ' ' + e.from_email + ' ' + e.subject + ' ' + e.snippet + ' ' + (e.why || '')).toLowerCase().indexOf(q) >= 0; });
}
function pileList(p) {
  var l = groups().filter(function (g) { return (p === 'all' || g.pile === p) && visible(g) && matches(g); });
  if (p === 'chase') l.sort(function (a, b) { return Date.parse(a.items[0].received_at) - Date.parse(b.items[0].received_at); });
  return l;
}
function unreadCount(p) { return groups().filter(function (g) { return (p === 'all' || g.pile === p) && (!S.f.acct || g.items.some(function (e) { return (e.account || 'personal') === S.f.acct; })); }).reduce(function (s, g) { return s + g.unread.length; }, 0); }
function current() { return groups().filter(function (g) { return g.id === S.open; })[0] || null; }
function pileOf(k) { return PILES.filter(function (p) { return p.key === k; })[0] || PILES[1]; }

function render() {
  if (!S.token && !S.key) return renderGate();
  var sc = document.querySelector('.rows, .home'), keep = sc ? sc.scrollTop : 0;
  var mail = S.view !== 'home' && S.view !== 'reading';
  document.getElementById('root').innerHTML = '<div class="app' + (mail ? ' mail' : '') + '">' + side() + (mail ? list() + detail() : S.view === 'reading' ? reading() : home()) + '</div>';
  var ns = document.querySelector('.rows, .home'); if (ns) ns.scrollTop = keep;
  bulkBar(); wire();
}
function wire() {
  var ta = document.getElementById('draft');
  if (ta) ta.addEventListener('input', function () { S.drafts[S.open] = ta.value; var sv = document.getElementById('savedflag'); if (sv) sv.style.display = 'none'; });
  var q = document.getElementById('q');
  if (q) q.addEventListener('input', function () { S.f.q = q.value; var pos = q.selectionStart; render(); var n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); });
  document.querySelectorAll('iframe[data-mid]').forEach(fitFrame);
}
// Emails grow as their images load, so keep fitting the frame to its content for a few seconds.
function fitFrame(f) {
  var go = function () { try { var d = f.contentDocument; if (!d || !d.body) return; var h = 0; Array.prototype.forEach.call(d.body.children, function (c) { var r = c.getBoundingClientRect(); if (r.height) h = Math.max(h, r.bottom); }); h += 16; if (h > 20) f.style.height = Math.min(6000, h + 8) + 'px'; } catch (e) {} };
  f.addEventListener('load', go);
  [0, 150, 500, 1200, 2500, 5000].forEach(function (t) { setTimeout(go, t); });
}

function side() {
  var h = '<aside class="side"><div class="brand"><div class="logo">' + I.inbox + '</div>Inbox</div>'
    + '<button class="nav' + (S.view === 'home' ? ' on' : '') + '" onclick="go(\'home\')">' + I.home + 'Home</button>'

    + '<button class="nav' + (S.view === 'reading' ? ' on' : '') + '" onclick="go(\'reading\')">' + I.book + 'Reading list<span class="n">' + (unreadCount('learn') || '') + '</span></button>'
    + '<div class="navlabel">Piles</div>';

    var n = unreadCount(p.key); if (p.key === 'new' && !n) return;

    + '<button class="iconbtn" title="Sign out" onclick="signOut()">' + I.out + '</button></div></aside>';
}
function tabs() {
  var h = '<div class="tabs"><div class="tab' + (S.view === 'home' ? ' on' : '') + '" onclick="go(\'home\')">Home</div><div class="tab' + (S.view === 'all' ? ' on' : '') + '" onclick="go(\'all\')">All ' + (unreadCount('all') || '') + '</div><div class="tab' + (S.view === 'reading' ? ' on' : '') + '" onclick="go(\'reading\')">Reading ' + (unreadCount('learn') || '') + '</div>';
  PILES.forEach(function (p) { var n = unreadCount(p.key); if (!n && p.key !== S.view) return; h += '<div class="tab' + (S.view === p.key ? ' on' : '') + '" onclick="go(\'' + p.key + '\')"><span class="dot" style="background:' + p.color + '"></span>' + p.title + ' ' + n + '</div>'; });
  return h + '</div>';
}

function home() {
  if (S.loading) return '<main class="home">' + tabs() + '<div class="skel" style="height:40px;width:300px;margin:0 0 20px"></div><div class="tiles">' + '<div class="skel" style="height:96px;margin:0"></div>'.repeat(5) + '</div></main>';
  var hr = Number(new Date().toLocaleString('en-GB', { hour:'numeric', hour12:false, timeZone:'Europe/London' }));
  var hi = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  var total = unreadCount('all');
  var people = pileList('reply').length, chase = unreadCount('chase'), fixN = groups().filter(function (g) { return g.isChat && g.unread.length; }).length;
  var bits = []; if (people) bits.push(people + ' ' + (people === 1 ? 'person' : 'people') + ' waiting on you'); if (fixN) bits.push(fixN + ' chat' + (fixN === 1 ? '' : 's') + ' to send broken things to'); if (chase) bits.push(chase + ' to chase');
  var day = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', timeZone:'Europe/London' });
  var h = '<main class="home">' + tabs() + '<div class="hero"><div class="day">' + day + '</div><h1 class="hello">' + hi + ', Owen</h1><div class="hellosub">' + (bits.length ? bits.join(' · ') + '.' : 'Inbox clear. Nice.') + '</div></div>' + inboxStrip() + '<div class="tiles">';
  PILES.filter(function (p) { return p.key !== 'new'; }).forEach(function (p) {
    h += '<div class="tile" style="--c:' + p.color + '" onclick="go(\'' + (p.key === 'learn' ? 'reading' : p.key) + '\')"><div class="lab"><span class="pico">' + PILE_ICON[p.key] + '</span>' + p.title + '</div><div class="num">' + unreadCount(p.key) + '</div><div class="hint">' + p.help + '</div></div>';
  });
  h += '</div><div class="grid2"><div>';
  var chats = groups().filter(function (g) { return g.isChat && g.unread.length; });
  h += '<div class="box"><h3>' + I.spark + 'Send to your chats</h3><div class="bsub">Every broken-tool email, grouped. Send to chat: you pick the Claude chat and it all lands there.</div>';
  if (!chats.length) h += '<div class="empty" style="padding:20px">Nothing broken.</div>';
  chats.forEach(function (g) {
    var kinds = issues({ items:g.unread }).map(function (x) { return x.title; });
    h += '<div class="chatrow"><div class="chatico" style="background:' + (CHAT_COLOURS[g.chat] || '#6c6d79') + '">' + esc(initials(chatShort(g.chat))) + '</div>'
      + '<div style="flex:1;min-width:0;cursor:pointer" onclick="openFrom(\'fix\',\'' + g.id + '\')"><div class="t">' + esc(chatShort(g.chat)) + ' chat <span class="badge">' + g.unread.length + '</span></div><div class="s">' + esc(kinds.slice(0, 4).join(' · ')) + '</div></div>'
      + '<button class="btn sm pri" onclick="sendToChat(\'' + g.id + '\')">' + I.send + 'Send to chat</button><button class="iconbtn" title="Copy instead" onclick="copyGroup(\'' + g.id + '\')">' + I.copy + '</button></div>';
  });
  h += '</div>';
  var people = pileList('reply').slice(0, 6);
  h += '<div class="box"><h3>' + I.pen + 'People waiting on you</h3><div class="bsub">Open one to read it and write a reply in your voice.</div>'
    + (people.length ? people.map(function (g) { var e = g.items[0]; return '<div class="mini" onclick="openFrom(\'reply\',\'' + g.id + '\')"><div class="av" style="background:' + hue(e.from_email) + '">' + esc(initials(e.from_name || e.from_email)) + '</div><div style="min-width:0"><div class="t">' + esc(e.from_name || e.from_email) + '</div><div class="l3">' + esc(e.subject) + '</div></div><div class="s">' + ago(e.received_at) + '</div></div>'; }).join('') : '<div class="empty" style="padding:20px">No one waiting.</div>') + '</div>';
  h += '</div><div>';
  h += '<div class="box"><h3>' + I.cal + 'Your next few days</h3><div class="bsub">From your Google Calendar. Green is free time.</div>' + timeline() + '</div>';
  var ch = pileList('chase').slice(0, 6);
  h += '<div class="box"><h3><span class="dot" style="background:var(--chase)"></span>Waiting on them</h3><div class="bsub">You emailed, no reply yet.</div>'
    + (ch.length ? ch.map(function (g) { var e = g.items[0]; return '<div class="mini" onclick="openFrom(\'chase\',\'' + g.id + '\')"><div style="min-width:0"><div class="t">' + esc(e.from_name || e.to_email) + '</div><div class="l3">' + esc(e.subject) + '</div></div><div class="s wait">' + Math.floor((Date.now() - Date.parse(e.received_at)) / 86400000) + 'd</div></div>'; }).join('') : '<div class="empty" style="padding:20px">Nothing to chase.</div>') + '</div>';
  // Littlebird's routine reports (it emails them), newest first, read or not.
  var lb = (S.data.emails || []).filter(function (e) { return /littlebird\.ai$/i.test(e.from_email || ''); }).slice(0, 4);
  if (lb.length) h += '<div class="box"><h3>' + I.spark + 'From Littlebird</h3><div class="bsub">Its routine reports. Littlebird can also see this inbox through your Moon connector.</div>'
    + lb.map(function (e) { var g = groups().filter(function (x) { return x.items.indexOf(e) >= 0; })[0]; return '<div class="mini" onclick="openFrom(\'all\',\'' + (g ? g.id : '') + '\')"><div style="min-width:0"><div class="t">' + esc(e.subject) + '</div><div class="l3">' + esc(e.why || e.snippet) + '</div></div><div class="s">' + ago(e.received_at) + '</div></div>'; }).join('') + '</div>';
  var sent = (S.data.sent || []).slice(0, 6);
  if (sent.length) h += '<div class="box"><h3>' + I.send + 'Sent to chats</h3><div class="bsub">Lands within about 5 minutes while your Mac is on.</div>' + sent.map(function (x) {
    var st = x.delivered_at ? (/^(delivered|queued)/.test(x.result || 'delivered') ? '<span style="color:var(--reply)">Delivered</span>' : '<span style="color:var(--fix)">Failed: ' + esc(x.result) + '</span>') : '<span style="color:var(--chase)">On its way</span>';
    return '<div class="sentrow"><div style="flex:1;min-width:0"><b>' + esc(x.session_title || 'Chat') + '</b> <span class="l3">' + x.n + ' email' + (x.n == 1 ? '' : 's') + ' · ' + ago(x.created_at) + ' ago</span></div>' + st + '</div>';
  }).join('') + '</div>';

function slackReply() { var g = current(); if (!g) return; var t = S.drafts[g.id] != null ? S.drafts[g.id] : g.items[0].draft_text; copyText(t, 'Reply copied. Paste it in Slack.'); if (g.items[0].gmail_url) window.open(g.items[0].gmail_url, '_blank'); }
function writeD() { var g = current(); if (!g) return; S.busy = 'write'; render(); api('writeDraft', { id:g.items[0].id }).then(function (r) { S.drafts[g.id] = r.text; S.busy = ''; render(); }).catch(fail); }
function saveD() {
  var g = current(); if (!g) return; var text = S.drafts[g.id] != null ? S.drafts[g.id] : g.items[0].draft_text; S.busy = 'save'; render();
  api('saveDraft', { id:g.items[0].id, text:text }).then(function () { g.items[0].draft_text = text; g.items[0].gmail_draft_id = 'x'; delete S.drafts[g.id]; S.busy = ''; render(); toast('Saved to Gmail drafts. Send it from Gmail.'); }).catch(fail);
}
function copyGroup(gid) {
  var g = groups().filter(function (x) { return x.id === gid; })[0]; if (!g) return;
  var list = g.unread.length ? g.unread : g.items, name = chatShort(g.chat), text;
  if (g.isChat) {
    var iss = issues({ items:list });
    text = 'From my inbox: ' + list.length + ' emails about things that broke, for this ' + name + ' chat. ' + iss.length + ' separate problem' + (iss.length === 1 ? '' : 's') + '. Check each one is still happening, fix what is ours, and tell me in one line each.\n\n'
      + iss.map(function (x, i) { var e = x.items[0]; return (i + 1) + '. ' + x.title + ' (' + x.items.length + ' emails, latest ' + e.received_at + ')\nFrom: ' + (e.from_name || '') + ' <' + (e.from_email || '') + '>\nSubject: ' + e.subject + '\n\n' + String(e.thread_text || e.snippet || '').slice(0, 2500); }).join('\n\n==========\n\n');
  } else {
    text = 'From my inbox, for this ' + name + ' chat. ' + (g.pile === 'learn' ? 'Read this and absorb anything useful into the right skill or notes. One-line summary back to me.' : 'Help me deal with this.') + '\n\n'
      + list.map(function (e) { return 'From: ' + (e.from_name || '') + ' <' + (e.from_email || '') + '>\nSubject: ' + e.subject + '\nReceived: ' + e.received_at + '\n\n' + (e.thread_text || e.snippet || ''); }).join('\n\n==========\n\n');
  }
  copyText(text, 'Copied. Paste it into your ' + name + ' chat.');
}
// Which of Owen's Claude chats fits a group best (by its title), then the rest by recent use.
var CHAT_HINT = { 'Moon':/moon/i, 'songdrafts':/^songdrafts chat$|songdrafts/i, 'TEZ':/^tez$|tez/i, 'CFO':/cfo|money/i, 'FANFLOWY / FAN HUB':/fan ?flowy|fan hub/i, 'Hormozi / King Kong Skills':/hormozi|king kong/i, 'RideTandem':/ridetandem|\brt\b/i };
function chatList() { return (S.data && S.data.chats && S.data.chats.chats) || []; }
function suggestChat(project) {
  var re = CHAT_HINT[project], l = chatList();
  var exact = l.filter(function (c) { return re && re.test(c.title) && !/:/.test(c.title); })[0];
  return exact || (re && l.filter(function (c) { return re.test(c.title); })[0]) || null;
}
// Where Owen sent this sender (or this tool group) before wins over a guess from chat names.
function suggestFor(g) {
  var r = (S.data && S.data.routes) || {}, key = g.isChat ? 'chat:' + g.chat : 'from:' + (g.items[0].from_email || ''), hit = r[key];
  var c = hit && chatList().filter(function (x) { return x.id === hit.id; })[0];
  if (c) return { chat:c, why:'You sent ' + (g.isChat ? 'these' : 'this sender') + ' here' + (hit.n > 1 ? ' ' + hit.n + ' times' : ' last time') };
  var s2 = suggestChat(g.chat); return s2 ? { chat:s2, why:'Suggested' } : null;
}
function sendToChat(gid) {
  var g = groups().filter(function (x) { return x.id === gid; })[0]; if (!g) return;
  var sf = suggestFor(g), list = g.unread.length ? g.unread : g.items, sug = sf && sf.chat, l = chatList();
  if (!l.length) { toast('Chat list not loaded yet. Your Mac fills it within 5 minutes.', true); return; }
  var m = document.createElement('div'); m.className = 'modal';
  var rows = (sug ? [sug] : []).concat(l.filter(function (c) { return !sug || c.id !== sug.id; }));
  m.innerHTML = '<div class="mbox"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">Send ' + list.length + ' email' + (list.length === 1 ? '' : 's') + ' to which chat?</b><button class="iconbtn" data-x>✕</button></div>'
    + '<div class="search">' + I.search + '<input placeholder="Search your chats" data-q></div>'
    + '<input class="noteinp" placeholder="Add a note for the chat (optional)" data-note>'
    + '<div class="chatpick" data-list></div><div class="help" style="color:var(--faint);font-size:12px">It lands in that chat within about 5 minutes, while your Mac is on. The emails are marked read.</div></div>';
  var draw = function (q) {
    m.querySelector('[data-list]').innerHTML = rows.filter(function (c) { return !q || c.title.toLowerCase().indexOf(q) >= 0; }).slice(0, 14).map(function (c, i) {
      return '<button class="pickrow" data-id="' + esc(c.id) + '" data-t="' + esc(c.title) + '"><span class="av" style="background:' + hue(c.title) + '">' + esc(initials(c.title)) + '</span><span style="flex:1;min-width:0;text-align:left"><span class="t">' + esc(c.title) + '</span>'
        + (sug && c.id === sug.id ? '<span class="sug">' + esc(sf.why) + '</span>' : '') + '</span><span class="s">' + (c.at ? ago(c.at) + ' ago' : '') + '</span></button>';
    }).join('') || '<div class="empty" style="padding:16px">No chat matches.</div>';
  };
  draw('');
  m.querySelector('[data-q]').addEventListener('input', function (e) { draw(e.target.value.toLowerCase()); });
  m.querySelector('[data-x]').onclick = function () { m.remove(); };
  m.addEventListener('click', function (e) {
    var b = e.target.closest('.pickrow'); if (!b) { if (e.target === m) m.remove(); return; }
    var ids = list.map(function (x) { return x.id; }), title = b.dataset.t, note = m.querySelector('[data-note]').value;
    m.remove(); setStatus(ids, 'to_claude');
    S.data.sent = [{ session_title: title, created_at: new Date().toISOString(), delivered_at: null, n: ids.length }].concat(S.data.sent || []);
    afterChange('Sending to ' + title + '. It lands within about 5 minutes.');
    S.data.routes = S.data.routes || {}; var rk = g.isChat ? 'chat:' + g.chat : 'from:' + (g.items[0].from_email || ''); var pr = S.data.routes[rk];
    S.data.routes[rk] = { id:b.dataset.id, title:title, n:(pr && pr.id === b.dataset.id ? pr.n : 0) + 1 };
    api('sendToChat', { ids: ids, sessionId: b.dataset.id, sessionTitle: title, note: note }).catch(function (err) { setStatus(ids, 'open'); fail(err); });
  });
  document.body.appendChild(m); m.querySelector('[data-q]').focus();
}

// Clipboard API first, then the old way, and if the browser blocks both, the text in a box to copy by hand.
function copyText(text, okMsg) {
  var old = function () { var a = document.createElement('textarea'); a.value = text; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} a.remove(); return ok; };
  var manual = function () { var m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div class="mbox"><b>Copy this into the chat</b><textarea readonly></textarea><div style="text-align:right"><button class="btn pri">Done</button></div></div>'; m.querySelector('textarea').value = text; m.querySelector('button').onclick = function () { m.remove(); }; document.body.appendChild(m); m.querySelector('textarea').select(); };
  var p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject();
  p.then(function () { toast(okMsg); }, function () { if (old()) toast(okMsg); else manual(); });
}
function reGroup() { S.data.emails.forEach(function (e) { e.group = e.category === 'fix' ? 'fix|' + (e.project || 'General TO DOs') : /comments-noreply@docs\.google\.com/i.test(e.from_email || '') ? (e.category || 'new') + '|docs|' + (e.from_name || '') : (e.category || 'new') + '|' + (e.from_email || '') + '|' + String(e.subject || '').toLowerCase().replace(/^(re|fwd?):\s*/g, '').replace(/[^a-z ]+/g, ' ').replace(/\s+/g, ' ').trim(); }); }
function movePile(p) { if (!p) return; var g = current(); var x = g.items.map(function (e) { return e.id; }); api('setPile', { ids:x, pile:p }).catch(fail); S.data.emails.forEach(function (e) { if (x.indexOf(e.id) >= 0) e.category = p; }); reGroup(); afterChange('Moved to ' + pileOf(p).title); }
function moveChat(c) { if (!c) return; var g = current(); var x = g.items.map(function (e) { return e.id; }); api('setChat', { ids:x, chat:c }).catch(fail); S.data.emails.forEach(function (e) { if (x.indexOf(e.id) >= 0) e.project = c; }); reGroup(); afterChange('Moved to the ' + chatShort(c) + ' chat'); }
function bulk(op) { var x = selIds(); setStatus(x, op === 'markRead' ? 'done' : 'open'); S.sel = {}; afterChange(x.length + (op === 'markRead' ? ' marked read' : ' marked unread')); api(op, { ids:x }).catch(fail); }
function bulkPile(p) { if (!p) return; var x = selIds(); api('setPile', { ids:x, pile:p }).catch(fail); S.data.emails.forEach(function (e) { if (x.indexOf(e.id) >= 0) e.category = p; }); reGroup(); S.sel = {}; afterChange('Moved to ' + pileOf(p).title); }
function bulkBin() { var x = selIds(); if (!confirm('Bin ' + x.length + ' emails? They go to Gmail\'s bin and can be got back for 30 days.')) return; S.data.emails = S.data.emails.filter(function (e) { return x.indexOf(e.id) < 0; }); S.sel = {}; afterChange(x.length + ' binned'); api('bin', { ids:x }).catch(fail); }
function theme() { var r = document.documentElement, now = r.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); r.dataset.theme = now === 'light' ? 'dark' : 'light'; try { localStorage.setItem('inbox-theme', r.dataset.theme); } catch (e) {} }

function load(op) {
  if (op === 'refresh') S.refreshing = true; render();
  return api(op || 'load').then(function (d) { S.data = d; S.loading = false; S.refreshing = false; S.stale = false; saveCache(d); render(); })
    .catch(function (e) {
      S.loading = false; S.refreshing = false;
      if (/sign in again/i.test(e.message)) { S.token = ''; S.key = ''; try { localStorage.removeItem('inbox-id'); } catch (x) {} }
      render(); toast(e.message, true);
    });
}
function refresh() { if (!S.refreshing) load('refresh'); }
// Opens instantly with what it showed last time (this browser only), then updates.
function saveCache(d) { try { localStorage.setItem('inbox-cache', JSON.stringify(d)); } catch (e) { try { localStorage.removeItem('inbox-cache'); } catch (x) {} } }
function readCache() { try { return JSON.parse(localStorage.getItem('inbox-cache') || 'null'); } catch (e) { return null; } }

function renderGate() {
  document.getElementById('root').innerHTML = '<div class="gate"><div class="box2"><div class="logo" style="width:44px;height:44px;margin:0 auto 14px;border-radius:12px">' + I.inbox + '</div>'
    + '<h1 style="margin:0;font-size:18px">Inbox</h1><div style="color:var(--dim);margin:4px 0 18px">Private. Sign in with your Google account.</div><div id="gbtn" style="display:flex;justify-content:center"></div></div></div>';
  gsi();
}
// Google gives a signed ID token (about an hour), kept in this browser until it runs out.
function gsi() {
  if (!window.google || !google.accounts) { setTimeout(gsi, 200); return; }
  if (!gsi.done) { google.accounts.id.initialize({ client_id:CLIENT_ID, callback:onCred, auto_select:true, use_fedcm_for_prompt:true, itp_support:true }); gsi.done = true; }
  var b = document.getElementById('gbtn');
  if (b && !b.childElementCount) google.accounts.id.renderButton(b, { theme:'filled_black', size:'large', shape:'pill', text:'signin_with' });
  if (!gsi.prompted) { gsi.prompted = true; google.accounts.id.prompt(); }
}
function tokenExp(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return 0; } }
function onCred(r) { S.token = r.credential; try { localStorage.setItem('inbox-id', S.token); } catch (e) {} S.loading = true; load('load'); }
function signOut() { S.token = ''; S.data = null; try { localStorage.removeItem('inbox-id'); localStorage.removeItem('inbox-cache'); } catch (e) {} if (window.google && google.accounts) google.accounts.id.disableAutoSelect(); render(); }

document.addEventListener('keydown', function (ev) {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || ev.metaKey || ev.ctrlKey || !S.data || S.view === 'home' || S.view === 'reading') return;
  var l = pileList(S.view), i = l.findIndex(function (g) { return g.id === S.open; }), k = ev.key.toLowerCase();
  if (k === 'j' || ev.key === 'ArrowDown') { if (l.length) { S.open = l[Math.min(i + 1, l.length - 1)].id; render(); } ev.preventDefault(); }
  else if (k === 'k' || ev.key === 'ArrowUp') { if (l.length) { S.open = l[Math.max(i - 1, 0)].id; render(); } ev.preventDefault(); }
  else if (k === 'e' && S.open) markRead();
  else if (k === 'u' && S.open) markUnread();
  else if (k === 'w' && S.open) writeD();
  else if (k === 'x' && S.open) pick(S.open);
  else if (k === 'r') refresh();
  else if (k === '/') { var q = document.getElementById('q'); if (q) { q.focus(); ev.preventDefault(); } }
  else if (ev.key === 'Escape') { S.open = null; S.sel = {}; render(); }
});

(function init() {
  try { var t = localStorage.getItem('inbox-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  // ?k= is Claude's test key from Owen's Mac: this tab only, never stored.
  var q = new URLSearchParams(location.search).get('k');
  if (q) { S.key = q; history.replaceState(null, '', location.pathname); }
  try { var tok = localStorage.getItem('inbox-id') || ''; if (tok && tokenExp(tok) > Date.now() + 60000) S.token = tok; } catch (e) {}
  if (S.token || S.key) { var c = readCache(); if (c) { S.data = c; S.loading = false; S.stale = true; S.refreshing = true; render(); } load('load'); } else render();
})();
</script>
