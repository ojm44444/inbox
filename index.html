<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inbox">
<meta name="robots" content="noindex">
<title>Inbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236d6af5'/%3E%3Cpath d='M16 34l8 0 4 6h8l4-6h8' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18 20h28l4 14v10a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2V34z' stroke='white' stroke-width='4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0c0f; --side: #0f1014; --panel: #131419; --raise: #1a1b21; --hover: #1d1e25; --sel: #23243a;
  --line: #22232b; --line2: #2c2d36;
  --text: #ececf1; --dim: #9b9ca8; --faint: #6b6c78;
  --acc: #6d6af5; --acc2: #8b89ff; --accbg: rgba(109,106,245,.14);
  --fix: #ff6b6b; --reply: #4cc38a; --chase: #f5a524; --learn: #5aa7ff; --noise: #6b6c78;
  --radius: 10px; --shadow: 0 10px 30px rgba(0,0,0,.45);
}
:root[data-theme="light"] {
  --bg: #f7f7f8; --side: #f0f0f2; --panel: #ffffff; --raise: #f6f6f8; --hover: #f1f1f4; --sel: #ebeafe;
  --line: #e7e7ea; --line2: #dcdce1; --text: #18181c; --dim: #5d5e68; --faint: #8c8d97;
  --accbg: rgba(109,106,245,.10); --shadow: 0 10px 30px rgba(20,20,40,.12);
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f7f7f8; --side: #f0f0f2; --panel: #ffffff; --raise: #f6f6f8; --hover: #f1f1f4; --sel: #ebeafe;
  --line: #e7e7ea; --line2: #dcdce1; --text: #18181c; --dim: #5d5e68; --faint: #8c8d97;
  --accbg: rgba(109,106,245,.10); --shadow: 0 10px 30px rgba(20,20,40,.12);
} }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13.5px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
a { color: var(--acc2); text-decoration: none; }
svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { display: grid; grid-template-columns: 232px 400px 1fr; height: 100vh; height: 100dvh; }

/* Sidebar */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.logo { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--acc), #a26bf5); display: grid; place-items: center; }
.logo svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 2.2; }
.navlabel { font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; padding: 14px 10px 6px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; cursor: pointer; color: var(--dim); user-select: none; border: 0; background: none; width: 100%; text-align: left; }
.nav:hover { background: var(--hover); color: var(--text); }
.nav.on { background: var(--raise); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
.nav .dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.nav .n { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.nav.on .n { color: var(--text); }
.sidefoot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 8px; }
.iconbtn { border: 0; background: none; padding: 6px; border-radius: 7px; cursor: pointer; color: var(--dim); display: inline-grid; place-items: center; }
.iconbtn:hover { background: var(--hover); color: var(--text); }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* List */
.list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.listhead { padding: 16px 18px 10px; display: flex; align-items: center; gap: 10px; }
.listhead h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.015em; }
.listhead .sub { color: var(--faint); font-size: 12px; }
.today { margin: 0 14px 8px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--dim); }
.today b { color: var(--text); font-weight: 600; }
.rows { overflow-y: auto; flex: 1; padding: 0 8px 80px; }
.row { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; padding: 10px 10px; border-radius: 8px; cursor: pointer; position: relative; }
.row:hover { background: var(--hover); }
.row.on { background: var(--sel); }
.row .ck { opacity: 0; margin-top: 2px; }
.row:hover .ck, .row .ck.show { opacity: 1; }
.ck { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--line2); display: grid; place-items: center; cursor: pointer; }
.ck.show { background: var(--acc); border-color: var(--acc); }
.ck.show::after { content: ""; width: 8px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.who { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.badge { background: var(--accbg); color: var(--acc2); font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 9px; line-height: 17px; }
.line2 { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.line3 { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.when { color: var(--faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.wait { color: var(--chase); }
.empty { text-align: center; color: var(--faint); padding: 60px 20px; }
.empty .big { font-size: 15px; color: var(--dim); font-weight: 600; margin-bottom: 4px; }

/* Detail */
.detail { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.dhead { padding: 18px 26px 14px; border-bottom: 1px solid var(--line); }
.dhead h2 { margin: 0 0 8px; font-size: 19px; font-weight: 650; letter-spacing: -.02em; line-height: 1.3; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--dim); font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 20px; background: var(--raise); border: 1px solid var(--line); font-size: 12px; color: var(--dim); }
.chip .dot { width: 7px; height: 7px; border-radius: 3px; }
.bar { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 26px; border-bottom: 1px solid var(--line); align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--raise); cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
.btn.pri:hover { background: var(--acc2); }
.btn.ghost { background: none; border-color: transparent; color: var(--dim); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.danger { color: var(--fix); }
.btn:disabled { opacity: .55; cursor: default; }
kbd { font: 11px Inter, sans-serif; color: var(--faint); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; margin-left: 2px; }
.btn.pri kbd { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.35); }
.sel { height: 32px; border-radius: 8px; border: 1px solid var(--line2); background: var(--raise); padding: 0 8px; cursor: pointer; }
.dbody { overflow-y: auto; flex: 1; padding: 18px 26px 40px; }
.msg { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); padding: 14px 16px; margin-bottom: 12px; }
.msg .mh { display: flex; justify-content: space-between; gap: 10px; color: var(--faint); font-size: 12px; margin-bottom: 8px; }
.msg pre { margin: 0; white-space: pre-wrap; font: 13.5px/1.6 Inter, sans-serif; color: var(--text); word-break: break-word; }
.composer { border: 1px solid var(--line2); border-radius: var(--radius); background: var(--bg); margin-bottom: 14px; overflow: hidden; }
.composer .ch { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; }
.composer textarea { width: 100%; min-height: 170px; border: 0; outline: 0; background: none; padding: 12px 14px; resize: vertical; font: 13.5px/1.6 Inter, sans-serif; }
.composer .cf { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); align-items: center; }
.saved { color: var(--reply); font-size: 12px; display: inline-flex; gap: 5px; align-items: center; }
.placeholder { display: grid; place-items: center; height: 100%; color: var(--faint); text-align: center; }
.placeholder .k { margin-top: 14px; display: grid; grid-template-columns: auto auto; gap: 6px 14px; font-size: 12px; text-align: left; }

/* Calendar + board views */
.view { overflow-y: auto; flex: 1; padding: 6px 18px 40px; }
.day { margin: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.ev { display: flex; gap: 12px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 6px; align-items: center; }
.ev .t { color: var(--dim); font-size: 12px; min-width: 74px; font-variant-numeric: tabular-nums; }
.ev.free { border-style: dashed; background: none; color: var(--reply); }
.col { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 12px 14px; margin-bottom: 10px; }
.col h3 { margin: 0 0 6px; font-size: 13.5px; display: flex; justify-content: space-between; }
.col h3 span { color: var(--faint); font-weight: 500; }
.card { display: block; padding: 7px 0; border-top: 1px solid var(--line); color: var(--text); font-size: 13px; }
.card:first-of-type { border-top: 0; }
.card small { color: var(--faint); margin-left: 6px; }

/* Bulk bar, toast, modal */
.bulk { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(120px); background: var(--raise); border: 1px solid var(--line2); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; display: flex; gap: 6px; align-items: center; transition: transform .2s ease; z-index: 20; }
.bulk.show { transform: translateX(-50%) translateY(0); }
.bulk b { padding: 0 8px; font-weight: 600; }
.toast { position: fixed; right: 20px; bottom: 20px; background: var(--raise); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); font-size: 13px; z-index: 30; opacity: 0; transform: translateY(10px); transition: all .2s; pointer-events: none; max-width: 360px; }
.toast.show { opacity: 1; transform: none; }
.toast.err { border-color: var(--fix); }
.warn { margin: 0 14px 8px; padding: 8px 12px; border-radius: 8px; background: rgba(245,165,36,.1); color: var(--chase); font-size: 12px; }
.gate { display: grid; place-items: center; height: 100vh; }
.gate .box { width: min(360px, 90vw); text-align: center; }
.gate input { width: 100%; height: 40px; border-radius: 9px; border: 1px solid var(--line2); background: var(--panel); padding: 0 12px; margin: 14px 0 10px; }
.skel { height: 52px; margin: 6px 10px; border-radius: 8px; background: linear-gradient(90deg, var(--panel), var(--raise), var(--panel)); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.back { display: none; }
.tabs { display: none; }

/* Phone */
@media (max-width: 900px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; height: auto; min-height: 100dvh; }
  .side { display: none; }
  .list { border-right: 0; min-height: 100dvh; }
  .rows { overflow: visible; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 0 14px 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 1px solid var(--line2); background: var(--panel); border-radius: 20px; padding: 6px 12px; font-size: 13px; color: var(--dim); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .tab.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tab .dot { width: 7px; height: 7px; border-radius: 3px; }
  .detail { position: fixed; inset: 0; z-index: 10; transform: translateX(100%); transition: transform .22s ease; }
  .detail.open { transform: none; }
  .back { display: inline-grid; }
  .dhead, .bar, .dbody { padding-left: 16px; padding-right: 16px; }
  .listhead { padding-top: calc(14px + env(safe-area-inset-top)); }
  kbd { display: none; }
  .row .ck { opacity: 1; }
}
</style>
</head>
<body>
<div id="root"></div>
<div class="bulk" id="bulk"></div>
<div class="toast" id="toast"></div>
<script>
// Google sign-in client ID for this site (public). Only ojm221100@gmail.com is let in, checked on the server.
var CLIENT_ID = '';
var API = 'https://script.google.com/macros/s/AKfycbzUIxAgrR4bZZCPNQ-Eqbc93gq2Tt_CMG5TXIixKmP0P63n_KX1zRMyCs8cHf7_GtFG/exec';
var PILES = [
  { key: 'fix', title: 'Fix', color: 'var(--fix)', help: 'Your tools broke. Repeats grouped.' },
  { key: 'reply', title: 'Reply', color: 'var(--reply)', help: 'People waiting on you.' },
  { key: 'chase', title: 'Chase', color: 'var(--chase)', help: 'Waiting on them. Longest first.' },
  { key: 'learn', title: 'Learn', color: 'var(--learn)', help: 'Marketing worth reading.' },
  { key: 'noise', title: 'Noise', color: 'var(--noise)', help: 'Nothing to do.' },
  { key: 'new', title: 'Not sorted', color: 'var(--faint)', help: 'Sorted on next refresh.' }
];
var I = {
  inbox: '<svg viewBox="0 0 24 24"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M5.5 5h13L21 13v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5z"/></svg>',
  refresh: '<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>',
  cal: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  board: '<svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M9 4v16M15 4v10"/></svg>',
  spark: '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>',
  send: '<svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  task: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  ext: '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  pen: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  bin: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>',
  gmail: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/></svg>'
};
var S = { key: '', token: '', data: null, view: 'fix', open: null, sel: {}, drafts: {}, busy: '', loading: true, refreshing: false, phoneOpen: false };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ago(at) { var m = (Date.now() - Date.parse(at)) / 60000; if (m < 60) return Math.max(1, Math.floor(m)) + 'm'; if (m < 1440) return Math.floor(m / 60) + 'h'; return Math.floor(m / 1440) + 'd'; }
function hm(iso) { return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' }); }
function dayName(iso) { return new Date(iso).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short', timeZone: 'Europe/London' }); }
function toast(msg, bad) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = 'toast'; }, 2600); }

function api(op, args) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', body: JSON.stringify({ action: 'inboxApi', idToken: S.token, key: S.key, op: op, args: args || {} }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'Something went wrong'); return j.data; });
}

function groups() {
  var by = {}, out = [];
  ((S.data && S.data.emails) || []).forEach(function (e) {
    var g = by[e.group];
    if (!g) { g = by[e.group] = { key: e.group, pile: e.category || 'new', items: [] }; out.push(g); }
    g.items.push(e);
  });
  out.forEach(function (g) { g.id = 'g' + Math.abs(g.key.split('').reduce(function (a, c) { return (a * 31 + c.charCodeAt(0)) | 0; }, 7)); });
  return out;
}
function pileList(p) {
  var l = groups().filter(function (g) { return g.pile === p; });
  if (p === 'chase') l.sort(function (a, b) { return Date.parse(a.items[0].received_at) - Date.parse(b.items[0].received_at); });
  return l;
}
function count(p) { return pileList(p).reduce(function (s, g) { return s + g.items.length; }, 0); }
function current() { return groups().filter(function (g) { return g.id === S.open; })[0] || null; }
function pileOf(k) { return PILES.filter(function (p) { return p.key === k; })[0] || PILES[1]; }

function render() {
  if (!S.token && !S.key) return renderGate();
  var root = document.getElementById('root');
  var listScroll = document.querySelector('.rows, .view'); var keep = listScroll ? listScroll.scrollTop : 0;
  root.innerHTML = '<div class="app">' + side() + list() + detail() + '</div>';
  var ls = document.querySelector('.rows, .view'); if (ls) ls.scrollTop = keep;
  bulkBar();
  var ta = document.getElementById('draft'); if (ta) ta.addEventListener('input', function () { S.drafts[S.open] = ta.value; var sv = document.getElementById('savedflag'); if (sv) sv.style.display = 'none'; });
}

function side() {
  var h = '<aside class="side"><div class="brand"><div class="logo">' + I.inbox + '</div>Inbox</div>';
  PILES.forEach(function (p) {
    var n = count(p.key); if (p.key === 'new' && !n) return;
    h += '<button class="nav' + (S.view === p.key ? ' on' : '') + '" onclick="go(\'' + p.key + '\')"><span class="dot" style="background:' + p.color + '"></span>' + p.title + '<span class="n">' + (n || '') + '</span></button>';
  });
  h += '<div class="navlabel">Plan</div>'
    + '<button class="nav' + (S.view === 'calendar' ? ' on' : '') + '" onclick="go(\'calendar\')">' + I.cal + 'Calendar<span class="n">' + ((S.data && S.data.calendar && S.data.calendar.events.length) || '') + '</span></button>'
    + '<button class="nav' + (S.view === 'board' ? ' on' : '') + '" onclick="go(\'board\')">' + I.board + 'Claude Board<span class="n">' + boardOpen() + '</span></button>';
  var last = S.data && S.data.last && S.data.last.at;
  h += '<div class="sidefoot"><span style="flex:1">' + (last ? 'Synced ' + ago(last) + ' ago' : '') + '</span>'
    + '<button class="iconbtn" title="Light or dark" onclick="theme()">' + I.sun + '</button>'
    + '<button class="iconbtn" title="Sign out" onclick="signOut()">' + I.back + '</button>'
    + '<button class="iconbtn' + (S.refreshing ? ' spin' : '') + '" title="Check Gmail now (R)" onclick="refresh()">' + I.refresh + '</button></div></aside>';
  return h;
}
function boardOpen() { return ((S.data && S.data.trello) || []).reduce(function (s, l) { return s + l.open; }, 0) || ''; }

function tabs() {
  var h = '<div class="tabs">';
  PILES.forEach(function (p) { var n = count(p.key); if (!n && p.key !== S.view) return; h += '<div class="tab' + (S.view === p.key ? ' on' : '') + '" onclick="go(\'' + p.key + '\')"><span class="dot" style="background:' + p.color + '"></span>' + p.title + ' ' + n + '</div>'; });
  h += '<div class="tab' + (S.view === 'calendar' ? ' on' : '') + '" onclick="go(\'calendar\')">Calendar</div><div class="tab' + (S.view === 'board' ? ' on' : '') + '" onclick="go(\'board\')">Board</div></div>';
  return h;
}

function list() {
  var title = S.view === 'calendar' ? 'Calendar' : S.view === 'board' ? 'Claude Board' : pileOf(S.view).title;
  var sub = S.view === 'calendar' ? 'Next three days' : S.view === 'board' ? 'Open cards per chat' : pileOf(S.view).help;
  var h = '<section class="list"><div class="listhead"><div style="flex:1;min-width:0"><h1>' + title + '</h1><div class="sub">' + sub + '</div></div>'
    + '<button class="iconbtn' + (S.refreshing ? ' spin' : '') + '" onclick="refresh()" title="Check Gmail now">' + I.refresh + '</button></div>' + tabs();
  var errs = ((S.data && S.data.errors) || []).concat((S.data && S.data.last && S.data.last.errors) || []);
  if (errs.length) h += '<div class="warn">' + esc(errs.join(' · ').slice(0, 240)) + '</div>';
  if (S.loading) return h + '<div class="rows">' + '<div class="skel"></div>'.repeat(8) + '</div></section>';
  if (S.view === 'calendar') return h + calendarView() + '</section>';
  if (S.view === 'board') return h + boardView() + '</section>';
  var next = S.data.calendar && S.data.calendar.free && S.data.calendar.free[0];
  var ev = S.data.calendar && S.data.calendar.events.filter(function (e) { return !e.allDay && Date.parse(e.end) > Date.now(); })[0];
  if (ev || next) h += '<div class="today">' + I.cal + '<span>' + (ev ? 'Next: <b>' + esc(ev.title) + '</b> ' + hm(ev.start) : '') + (ev && next ? ' · ' : '') + (next ? 'Free ' + hm(next.start) + '–' + hm(next.end) : '') + '</span></div>';
  var l = pileList(S.view);
  if (!l.length) return h + '<div class="rows"><div class="empty"><div class="big">All clear</div>Nothing in ' + pileOf(S.view).title + '.</div></div></section>';
  h += '<div class="rows">';
  l.forEach(function (g) {
    var e = g.items[0], chase = e.kind === 'chase';
    var who = chase ? 'To ' + (e.from_name || e.to_email) : (e.from_name || e.from_email);
    var when = chase ? '<span class="wait">' + Math.floor((Date.now() - Date.parse(e.received_at)) / 86400000) + 'd waiting</span>' : ago(e.received_at);
    h += '<div class="row' + (S.open === g.id ? ' on' : '') + '" onclick="openG(\'' + g.id + '\')">'
      + '<div class="ck' + (S.sel[g.id] ? ' show' : '') + '" onclick="event.stopPropagation();pick(\'' + g.id + '\')"></div>'
      + '<div style="min-width:0"><div class="who">' + esc(who) + (g.items.length > 1 ? '<span class="badge">' + g.items.length + '</span>' : '') + '</div>'
      + '<div class="line2">' + esc(e.subject) + '</div><div class="line3">' + esc(e.why || e.snippet) + '</div></div>'
      + '<div class="when">' + when + '</div></div>';
  });
  return h + '</div></section>';
}

function calendarView() {
  var c = S.data.calendar; if (!c) return '<div class="view"><div class="empty">Calendar not available.</div></div>';
  var items = c.events.map(function (e) { return { t: e.start, ev: e }; }).concat(c.free.map(function (f) { return { t: f.start, free: f }; }))
    .sort(function (a, b) { return a.t < b.t ? -1 : 1; });
  var h = '<div class="view">', day = '';
  items.forEach(function (x) {
    var d = dayName(x.t); if (d !== day) { h += '<div class="day">' + d + '</div>'; day = d; }
    if (x.free) h += '<div class="ev free"><span class="t">' + hm(x.free.start) + '</span>Free until ' + hm(x.free.end) + '</div>';
    else h += '<div class="ev"><span class="t">' + (x.ev.allDay ? 'All day' : hm(x.ev.start)) + '</span><span>' + esc(x.ev.title) + '</span></div>';
  });
  return h + '</div>';
}
function boardView() {
  var t = S.data.trello; if (!t) return '<div class="view"><div class="empty">Trello not available.</div></div>';
  return '<div class="view">' + t.map(function (l) {
    return '<div class="col"><h3>' + esc(l.name) + '<span>' + l.open + '</span></h3>' + l.cards.map(function (c) {
      return '<a class="card" target="_blank" href="' + esc(c.url) + '">' + esc(c.name) + (c.due ? '<small>due ' + esc(c.due.slice(0, 10)) + '</small>' : '') + '</a>';
    }).join('') + '</div>';
  }).join('') + '</div>';
}

function detail() {
  var g = current();
  if (!g || S.view === 'calendar' || S.view === 'board') {
    return '<section class="detail"><div class="placeholder"><div>' + I.inbox.replace('<svg', '<svg style="width:34px;height:34px;opacity:.5"') + '<div style="margin-top:10px">Pick an email</div>'
      + '<div class="k"><kbd>J</kbd><kbd>K</kbd><span></span><span>Move</span><kbd>E</kbd><span>Mark read</span><kbd>C</kbd><span>Send to Claude</span><kbd>W</kbd><span>Write reply</span><kbd>X</kbd><span>Select</span><kbd>R</kbd><span>Refresh</span></div></div></div></section>';
  }
  var e = g.items[0], p = pileOf(g.pile), chase = e.kind === 'chase', many = g.items.length > 1;
  var replyable = (g.pile === 'reply' || g.pile === 'chase') && !many;
  var draft = S.drafts[g.id] != null ? S.drafts[g.id] : (e.draft_text || '');
  var h = '<section class="detail' + (S.phoneOpen ? ' open' : '') + '"><div class="dhead"><div style="display:flex;gap:8px;align-items:flex-start">'
    + '<button class="iconbtn back" onclick="closeG()">' + I.back + '</button><h2 style="flex:1">' + esc(e.subject) + '</h2></div>'
    + '<div class="chips"><span class="chip"><span class="dot" style="background:' + p.color + '"></span>' + p.title + '</span>'
    + '<span>' + esc(chase ? 'To ' + (e.from_name || e.to_email) : (e.from_name || '')) + ' <span style="color:var(--faint)">' + esc(chase ? '' : e.from_email) + '</span></span>'
    + (many ? '<span class="chip">' + g.items.length + ' emails</span>' : '') + (e.why ? '<span class="chip">' + I.spark.replace('<svg', '<svg style="width:12px;height:12px"') + esc(e.why) + '</span>' : '') + '</div></div>';

  h += '<div class="bar">';
  if (replyable && !draft) h += '<button class="btn pri" onclick="writeD()" ' + (S.busy ? 'disabled' : '') + '>' + I.pen + (S.busy === 'write' ? 'Writing…' : chase ? 'Write a nudge' : 'Write reply') + '<kbd>W</kbd></button>';
  if (g.pile !== 'noise') {
    h += '<button class="btn' + (replyable ? '' : ' pri') + '" onclick="toClaude()" ' + (S.busy ? 'disabled' : '') + '>' + I.send + (S.busy === 'claude' ? 'Sending…' : 'Send to Claude') + '<kbd>C</kbd></button>'
      + '<select class="sel" id="col" title="Claude Board column">' + S.data.columns.map(function (c) { return '<option' + (c === (e.project || 'General TO DOs') ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>'
      + '<button class="btn ghost" onclick="copyG()">' + I.copy + 'Copy</button>';
  }
  h += '<button class="btn ghost" onclick="toTask()">' + I.task + 'Task</button>'
    + '<a class="btn ghost" target="_blank" href="' + calLink(e) + '">' + I.cal + 'Schedule</a>'
    + (e.gmail_url ? '<a class="btn ghost" target="_blank" href="' + esc(e.gmail_url) + '">' + I.gmail + 'Gmail</a>' : '')
    + '<span style="flex:1"></span><select class="sel" onchange="movePile(this.value)" title="Move to pile"><option value="">Move…</option>' + PILES.filter(function (x) { return x.key !== 'new' && x.key !== g.pile; }).map(function (x) { return '<option value="' + x.key + '">' + x.title + '</option>'; }).join('') + '</select>'
    + '<button class="btn" onclick="markRead()" ' + (S.busy ? 'disabled' : '') + '>' + I.check + (chase ? 'Dismiss' : 'Mark read') + '<kbd>E</kbd></button></div>';

  h += '<div class="dbody">';
  if (replyable && draft) {
    var saved = e.gmail_draft_id && S.drafts[g.id] == null;
    h += '<div class="composer"><div class="ch">' + I.pen + (chase ? 'Nudge to ' : 'Reply to ') + esc(chase ? (e.from_name || e.to_email) : (e.from_name || e.from_email)) + ' <span style="flex:1"></span>written in your voice</div>'
      + '<textarea id="draft">' + esc(draft) + '</textarea><div class="cf"><button class="btn pri" onclick="saveD()" ' + (S.busy ? 'disabled' : '') + '>' + I.gmail + (S.busy === 'save' ? 'Saving…' : 'Save to Gmail drafts') + '</button>'
      + '<button class="btn ghost" onclick="writeD()">' + I.spark + 'Rewrite</button><span style="flex:1"></span><span class="saved" id="savedflag" style="' + (saved ? '' : 'display:none') + '">' + I.check + 'In Gmail drafts</span></div></div>';
  }
  g.items.forEach(function (x) {
    var parts = String(x.thread_text || x.snippet || '').split(/\n\n=====\n\n/);
    parts.forEach(function (m) {
      var hdr = m.match(/^From: (.*)\nDate: (.*)\n\n/);
      h += '<div class="msg">' + (hdr ? '<div class="mh"><span>' + esc(hdr[1]) + '</span><span>' + esc(hdr[2].replace(/\s*[+-]\d{4}.*$/, '')) + '</span></div>' : '<div class="mh"><span>' + esc(x.from_name || '') + '</span><span>' + ago(x.received_at) + ' ago</span></div>')
        + '<pre>' + esc(hdr ? m.slice(hdr[0].length) : m) + '</pre></div>';
    });
  });
  return h + '</div></section>';
}

function calLink(e) {
  var f = S.data.calendar && S.data.calendar.free[0], s = f ? new Date(f.start) : new Date(Date.now() + 3600000), en = new Date(s.getTime() + 30 * 60000);
  var z = function (d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); };
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=' + encodeURIComponent((e.kind === 'chase' ? 'Chase: ' : 'Email: ') + e.subject)
    + '&amp;dates=' + z(s) + '/' + z(en) + '&amp;details=' + encodeURIComponent((e.gmail_url || '') + '\n\n' + (e.snippet || ''));
}

function bulkBar() {
  var ids = selIds(), b = document.getElementById('bulk');
  b.className = 'bulk' + (ids.length ? ' show' : '');
  b.innerHTML = '<b>' + ids.length + ' selected</b><button class="btn" onclick="bulk(\'markRead\')">' + I.check + 'Mark read</button>'
    + '<select class="sel" onchange="bulkPile(this.value)"><option value="">Move to…</option>' + PILES.filter(function (x) { return x.key !== 'new'; }).map(function (x) { return '<option value="' + x.key + '">' + x.title + '</option>'; }).join('') + '</select>'
    + '<button class="btn danger" onclick="bulkBin()">' + I.bin + 'Bin</button><button class="btn ghost" onclick="S.sel={};render()">Cancel</button>';
}
function selIds() { var out = []; groups().forEach(function (g) { if (S.sel[g.id]) out = out.concat(g.items.map(function (e) { return e.id; })); }); return out; }

// Actions
function go(v) { S.view = v; S.open = null; S.phoneOpen = false; S.sel = {}; render(); }
function openG(id) { S.open = id; S.phoneOpen = true; render(); }
function closeG() { S.phoneOpen = false; render(); }
function pick(id) { if (S.sel[id]) delete S.sel[id]; else S.sel[id] = true; render(); }
function gone(ids, msg) {
  var l = pileList(S.view), i = l.findIndex(function (g) { return g.id === S.open; });
  S.data.emails = S.data.emails.filter(function (e) { return ids.indexOf(e.id) < 0; });
  var nl = pileList(S.view); S.open = nl.length ? nl[Math.min(Math.max(i, 0), nl.length - 1)].id : null;
  if (!S.open) S.phoneOpen = false;
  S.busy = ''; render(); if (msg) toast(msg);
}
function fail(e) { S.busy = ''; render(); toast(e.message, true); }
function ids() { var g = current(); return g ? g.items.map(function (e) { return e.id; }) : []; }
function markRead() { var x = ids(); if (!x.length) return; S.busy = 'read'; render(); api('markRead', { ids: x }).then(function () { gone(x, 'Marked read'); }).catch(fail); }
function toClaude() {
  var x = ids(); if (!x.length) return; var col = (document.getElementById('col') || {}).value; S.busy = 'claude'; render();
  api('toClaude', { ids: x, column: col }).then(function (r) { gone(x, 'Sent to ' + r.column); }).catch(fail);
}
function toTask() {
  var x = ids(); if (!x.length) return; var due = prompt('Due date? (YYYY-MM-DD, or leave empty)', ''); if (due === null) return;
  api('toTask', { ids: x, due: due ? due + 'T17:00:00.000Z' : '' }).then(function () { gone(x, 'Added to General TO DOs'); }).catch(fail);
}
function writeD() {
  var g = current(); if (!g) return; S.busy = 'write'; render();
  api('writeDraft', { id: g.items[0].id }).then(function (r) { S.drafts[g.id] = r.text; S.busy = ''; render(); }).catch(fail);
}
function saveD() {
  var g = current(); if (!g) return; var text = S.drafts[g.id] != null ? S.drafts[g.id] : g.items[0].draft_text; S.busy = 'save'; render();
  api('saveDraft', { id: g.items[0].id, text: text }).then(function () { g.items[0].draft_text = text; g.items[0].gmail_draft_id = 'x'; delete S.drafts[g.id]; S.busy = ''; render(); toast('Saved to Gmail drafts'); }).catch(fail);
}
function copyG() {
  var g = current(); if (!g) return; var e = g.items[0];
  var text = 'From my inbox (' + (e.project || 'General') + '). ' + (g.pile === 'fix' ? 'Fix this.' : g.pile === 'learn' ? 'Absorb anything useful into the right skill or notes.' : 'Help me deal with this.') + '\n\n'
    + g.items.map(function (x) { return 'From: ' + (x.from_name || '') + ' <' + (x.from_email || '') + '>\nSubject: ' + x.subject + '\nReceived: ' + x.received_at + '\n\n' + (x.thread_text || x.snippet || ''); }).join('\n\n==========\n\n');
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast('Copied. Paste into any Claude chat.'); }, function () { toast('Copy failed', true); });
}
function movePile(p) {
  if (!p) return; var x = ids();
  api('setPile', { ids: x, pile: p }).catch(fail);
  S.data.emails.forEach(function (e) { if (x.indexOf(e.id) >= 0) e.category = p; }); S.open = null; S.phoneOpen = false; render(); toast('Moved to ' + pileOf(p).title);
}
function bulk(op) { var x = selIds(); api(op, { ids: x }).then(function () { S.sel = {}; gone(x, x.length + ' marked read'); }).catch(fail); }
function bulkPile(p) { if (!p) return; var x = selIds(); api('setPile', { ids: x, pile: p }).catch(fail); S.data.emails.forEach(function (e) { if (x.indexOf(e.id) >= 0) e.category = p; }); S.sel = {}; render(); toast('Moved to ' + pileOf(p).title); }
function bulkBin() { var x = selIds(); if (!confirm('Bin ' + x.length + ' emails? They go to Gmail\'s bin and can be got back for 30 days.')) return; api('bin', { ids: x }).then(function () { S.sel = {}; gone(x, x.length + ' binned'); }).catch(fail); }
function theme() { var r = document.documentElement, now = r.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); r.dataset.theme = now === 'light' ? 'dark' : 'light'; try { localStorage.setItem('inbox-theme', r.dataset.theme); } catch (e) {} }

function load(op) {
  if (op === 'refresh') S.refreshing = true; render();
  return api(op || 'load').then(function (d) {
    S.data = d; S.loading = false; S.refreshing = false;
    if (S.view !== 'calendar' && S.view !== 'board' && !count(S.view)) { var f = PILES.filter(function (p) { return count(p.key); })[0]; if (f) S.view = f.key; }
    render();
  }).catch(function (e) {
    S.loading = false; S.refreshing = false;
    if (/sign in again/i.test(e.message)) { S.token = ''; S.key = ''; try { localStorage.removeItem('inbox-id'); } catch (x) {} }
    render(); toast(e.message, true);
  });
}
function refresh() { if (!S.refreshing) load('refresh'); }

function renderGate() {
  document.getElementById('root').innerHTML = '<div class="gate"><div class="box"><div class="logo" style="width:44px;height:44px;margin:0 auto 14px;border-radius:12px">' + I.inbox + '</div>'
    + '<h1 style="margin:0;font-size:18px">Inbox</h1><div style="color:var(--dim);margin:4px 0 18px">Private. Sign in with your Google account.</div>'
    + '<div id="gbtn" style="display:flex;justify-content:center"></div>' + (CLIENT_ID ? '' : '<div style="color:var(--faint);font-size:12px">Sign-in is not set up yet.</div>') + '</div></div>';
  gsi();
}
// Google gives a signed ID token (about an hour). Kept in this browser until it runs out, then Google signs him in again.
function gsi() {
  if (!CLIENT_ID) return;
  if (!window.google || !google.accounts) { setTimeout(gsi, 200); return; }
  if (!gsi.done) { google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCred, auto_select: true, use_fedcm_for_prompt: true, itp_support: true }); gsi.done = true; }
  var b = document.getElementById('gbtn');
  if (b) google.accounts.id.renderButton(b, { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with' });
  google.accounts.id.prompt();
}
function tokenExp(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return 0; } }
function onCred(r) {
  S.token = r.credential;
  try { localStorage.setItem('inbox-id', S.token); } catch (e) {}
  S.loading = true; load('load');
}
function signOut() {
  S.token = ''; S.data = null; try { localStorage.removeItem('inbox-id'); } catch (e) {}
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  render();
}

document.addEventListener('keydown', function (ev) {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || ev.metaKey || ev.ctrlKey || !S.data) return;
  var l = pileList(S.view), i = l.findIndex(function (g) { return g.id === S.open; }), k = ev.key.toLowerCase();
  if (k === 'j' || ev.key === 'ArrowDown') { if (l.length) { S.open = l[Math.min(i + 1, l.length - 1)].id; render(); } ev.preventDefault(); }
  else if (k === 'k' || ev.key === 'ArrowUp') { if (l.length) { S.open = l[Math.max(i - 1, 0)].id; render(); } ev.preventDefault(); }
  else if (k === 'e' && S.open) markRead();
  else if (k === 'c' && S.open) toClaude();
  else if (k === 'w' && S.open) writeD();
  else if (k === 'x' && S.open) pick(S.open);
  else if (k === 'r') refresh();
  else if (ev.key === 'Escape') { S.open = null; S.sel = {}; render(); }
});

(function init() {
  try { var t = localStorage.getItem('inbox-theme'); if (t) document.documentElement.dataset.theme = t; localStorage.removeItem('inbox-key'); } catch (e) {}
  // ?k= is Claude's test key from Owen's Mac: this tab only, never stored.
  var q = new URLSearchParams(location.search).get('k');
  if (q) { S.key = q; history.replaceState(null, '', location.pathname); }
  try { var tok = localStorage.getItem('inbox-id') || ''; if (tok && tokenExp(tok) > Date.now() + 60000) S.token = tok; } catch (e) {}
  if (S.token || S.key) load('load'); else render();
})();
</script>
</body>
</html>
